services:
  kenosis-chat:
    build: .
    container_name: kenosis-chat
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Published on the LAN so the Cloudflare tunnel (delphi.disinfo.zone) can route to SERVER-IP:8770.
      # If cloudflared ever runs on THIS host (or in this compose), tighten to "127.0.0.1:8770:8770".
      - "8770:8770"
    volumes:
      - ./data:/data            # SQLite db (chat.db) persists here — DO NOT delete, holds all accounts/chats/settings
      - ./backups:/backups      # automated DB backups, kept apart from /data so one volume copy never has both
    env_file:
      - local.env               # PRIVATE secrets: oMLX endpoint + API key + KENOSIS_SESSION_SECRET (gitignored)
    environment:
      KENOSIS_DB: /data/chat.db
      KENOSIS_BACKUP_DIR: /backups
      # Served over HTTPS at the edge by the Cloudflare tunnel, so the session cookie must be Secure.
      KENOSIS_COOKIE_SECURE: "1"
      # The container runs as UID 10001 (non-root). One-time host setup for the volumes:
      #   sudo chown -R 10001:10001 ./data ./backups
      # Admin is created on the first web visit (no plaintext password in this file).
      # To bootstrap one on startup instead, add:
      #   KENOSIS_ADMIN_USER: "david"
      #   KENOSIS_ADMIN_PASS: "a-strong-password"
      # KENOSIS_SESSION_DAYS: "30"
      # Set KENOSIS_TRUST_PROXY: "0" if clients can hit this port without going through Cloudflare
      # (the forwarded-IP headers used for login throttling are spoofable by direct clients).

  # ----------------------------------------------------------------------------
  # The Cloudflare tunnel (delphi.disinfo.zone) is managed outside this stack and
  # routes its public hostname to http://SERVER-IP:8770. If you'd rather run it in
  # this compose, uncomment below, paste the tunnel token, point the hostname at
  # http://kenosis-chat:8770, and you can drop the "ports:" mapping above.
  # ----------------------------------------------------------------------------
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: kenosis-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: "your-cloudflare-tunnel-token"
  #   depends_on:
  #     - kenosis-chat
